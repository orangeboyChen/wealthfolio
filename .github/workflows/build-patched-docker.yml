name: Build Patched Docker Image

on:
  schedule:
    # 02:40 Asia/Shanghai every day.
    - cron: '40 18 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Wealthfolio version to build, for example 3.5.0 or v3.5.0. Empty means latest stable.'
        required: false
        type: string
      force:
        description: 'Rebuild even when the target image tag already exists.'
        default: false
        required: false
        type: boolean
      push_latest:
        description: 'Also update the latest tag. Scheduled builds always update latest for stable releases.'
        default: false
        required: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version || 'latest-stable' }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/orangeboychen/wealthfolio
  UPSTREAM_REPOSITORY: afadil/wealthfolio

jobs:
  prepare:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
      push_latest: ${{ steps.resolve.outputs.push_latest }}
    steps:
      - name: Resolve upstream version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            tag="${INPUT_VERSION#refs/tags/}"
            tag="${tag#v}"
            tag="v${tag}"
          else
            tag="$(
              git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPOSITORY}.git" 'refs/tags/v*' |
                awk '{print $2}' |
                sed 's#refs/tags/##' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 1
            )"
          fi

          if [ -z "$tag" ]; then
            echo "No upstream version tag found" >&2
            exit 1
          fi

          if ! git ls-remote --exit-code --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${tag}" >/dev/null; then
            echo "Upstream tag ${tag} does not exist" >&2
            exit 1
          fi

          commit="$(
            git ls-remote --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${tag}^{}" |
              awk '{print $1}' |
              head -n 1
          )"

          if [ -z "$commit" ]; then
            commit="$(
              git ls-remote --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${tag}" |
                awk '{print $1}' |
                head -n 1
            )"
          fi

          if [ -z "$commit" ]; then
            echo "Unable to resolve commit for ${tag}" >&2
            exit 1
          fi

          version="${tag#v}"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${INPUT_PUSH_LATEST:-false}" = "true" ]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved ${tag} to ${commit}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check target image tag
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${FORCE:-false}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested"
            exit 0
          fi

          if docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "${REGISTRY_IMAGE}:${VERSION} already exists; skipping build"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "${REGISTRY_IMAGE}:${VERSION} does not exist; building"
          fi

  build:
    name: Build and Push
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Checkout upstream release commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.commit }}
          path: source

      - name: Apply local patch files
        working-directory: source
        run: |
          set -euo pipefail
          patches=(
            ../automation/patches/connect-config-frontend.patch
            ../automation/patches/connect-config-backend.patch
            ../automation/patches/connect-config-tauri.patch
          )

          for patch in "${patches[@]}"; do
            git apply --3way --check "$patch"
            git apply --3way "$patch"
          done

      - name: Resolve patched commit SHA
        id: vars
        working-directory: source
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=sha-${{ steps.vars.outputs.sha_short }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CONNECT_AUTH_URL=${{ vars.CONNECT_AUTH_URL }}
            CONNECT_AUTH_PUBLISHABLE_KEY=${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
            CONNECT_API_URL=${{ vars.CONNECT_API_URL }}
